aid: cocos
name: Cocos Capital
description: >-
  Cocos Capital is an Argentine investech and online broker (ALyC, founded 2021
  in Buenos Aires) offering a 100% digital investment platform for retail
  investors. Through its mobile app and website, users open an account and trade
  Argentine stocks, CEDEARs, sovereign and corporate bonds, mutual funds, the MEP
  dollar, US stocks via an international account, and crypto, with a fast
  onboarding experience aimed at making investing accessible to everyone
  ("Invertir es para todos"). Cocos is registered as an ALyC and regulated by
  Argentina's Comision Nacional de Valores (CNV), settles through the BYMA group,
  and has surpassed 300,000 accounts. Cocos publishes no official public API for
  developers; the client libraries that exist (e.g. pyCocos) are unofficial,
  community-built and reverse-engineered from the app, so they are recorded here
  as third-party and unsupported.
